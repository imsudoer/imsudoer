<svg width="760" height="255" viewBox="0 0 760 255" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap');
    .term-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #8b949e; }
    .t-cmd { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
    .t-prompt { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #58a6ff; }
    .t-kw { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #ff7b72; }
    .t-type { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #79c0ff; }
    .t-var { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #d2a8ff; }
    .t-punct { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #c9d1d9; }
    .t-str { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; fill: #a5d6ff; }
    .t-comment { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 400; fill: #8b949e; font-style: italic; }
    .t-success { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #3fb950; }
    .badge-txt { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #58a6ff; }
  </style>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="759" height="254" rx="10" fill="#0d1117" stroke="#30363d"/>

